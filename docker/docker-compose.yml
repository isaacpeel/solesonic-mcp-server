name: solesonic-mcp

services:
  solesonic-mcp-redis:
    env_file:
      - .env
    image: redis:8.8.0
    container_name: solesonic-mcp-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --bind 0.0.0.0
      --protected-mode yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG ""
      --rename-command DEBUG ""
      --appendonly yes
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - solesonic-mcp-redis:/data
    networks:
      - solesonic-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  solesonic-mcp-postgres:
    env_file:
      - .env
    image: postgres:18.6
    container_name: solesonic-mcp-db
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-solesonic-mcp-server}
    security_opt:
      - no-new-privileges:true
    volumes:
      - solesonic-mcp-postgres:/var/lib/postgresql/mcp/data
      - ./init_schema.sh:/docker-entrypoint-initdb.d/init_schema.sh
    networks:
      - solesonic-network
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${POSTGRES_DB:-solesonic-mcp-server}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: [ "postgres", "-c", "listen_addresses=*" ]

  solesonic-mcp-server:
    env_file:
      - .env
    build:
      context: ..
      dockerfile: docker/Dockerfile
      no_cache: true
    container_name: solesonic-mcp-server
    ports:
      - "127.0.0.1:8181:8181"
    environment:
      - SERVER_PORT=8181
      - REDIS_HOST=solesonic-mcp-redis
      # Overrides the .env value, which points at localhost:5433 for running the app outside Docker.
      # On the bridge network the database is reached by service name on its container port.
      - DATABASE_URL=jdbc:postgresql://solesonic-mcp-postgres:5432/${POSTGRES_DB:-solesonic-mcp-server}
    volumes:
      - /var/log/solesonic-mcp-server:/var/log/solesonic-mcp-server
    # Flyway runs during startup and the workflow table is read before the MCP tools register, so a
    # database that is merely "started" is not enough — wait for it to accept connections.
    depends_on:
      solesonic-mcp-redis:
        condition: service_healthy
      solesonic-mcp-postgres:
        condition: service_healthy
    networks:
      - solesonic-network

networks:
  solesonic-network:
    driver: bridge
    name: solesonic-network
    external: true

volumes:
  solesonic-mcp-redis:
      name: solesonic-mcp-redis
  solesonic-mcp-postgres:
      name: solesonic-mcp-postgres
