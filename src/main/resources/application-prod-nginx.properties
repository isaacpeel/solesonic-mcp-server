management.endpoints.access.default=none

server.forward-headers-strategy=native

solesonic.mcp.resource=${MCP_REGISTRATION_ENDPOINT}

solesonic.agent.security.enabled=true

spring.ai.openai.base-url=${CHAT_OPENAI_HOST}

spring.ai.model.chat=openai
spring.ai.openai.model=${DEFAULT_CHAT_MODEL}
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.embedding.model=${EMBEDDING_MODEL}

# ECS JSON application log (logback-spring.xml), read by solesonic-log-agent; the security log is unchanged.
logging.file.name=/var/log/solesonic-mcp-server/solesonic-mcp-server.log
logging.structured.format.console=ecs
logging.structured.format.file=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.environment=prod-nginx
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.max-file-size=100MB

# --- HyperDX (~/solesonic/solesonic-hyperdx): traces and metrics over OTLP/HTTP --------------------------------------
# Logs stay file-based (ECS, above) and are shipped by solesonic-log-agent. HYPERDX_INGESTION_KEY comes from .env.
management.tracing.sampling.probability=1.0
management.tracing.export.enabled=true
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}/v1/traces
management.opentelemetry.tracing.export.otlp.headers.authorization=${HYPERDX_INGESTION_KEY:}
management.opentelemetry.tracing.export.otlp.compression=gzip
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}/v1/metrics
management.otlp.metrics.export.headers.authorization=${HYPERDX_INGESTION_KEY:}
management.otlp.metrics.export.step=60s
management.opentelemetry.resource-attributes.deployment.environment.name=prod
management.logging.export.otlp.enabled=false
# No prompt, completion, tool-argument or vector-store content in spans, ever.
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false
spring.ai.chat.client.observations.log-prompt=false
spring.ai.chat.client.observations.log-completion=false
spring.ai.tools.observations.include-content=false
spring.ai.vectorstore.observations.log-query-response=false
