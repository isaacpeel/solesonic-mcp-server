spring.application.name=solesonic-mcp-server

server.port=8181
server.shutdown=immediate

logging.level.root=INFO
logging.level.org.apache.coyote.http11.Http11Processor=ERROR
logging.level.org.apache.tomcat.util.net.NioEndpoint=ERROR
logging.level.io.modelcontextprotocol.util.KeepAliveScheduler=ERROR
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

spring.main.lazy-initialization=false
spring.http.codecs.max-in-memory-size=10MB

spring.ai.mcp.server.name=solesonic-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.prompt=true
spring.ai.mcp.server.capabilities.completion=true
spring.ai.mcp.server.capabilities.resource=true

spring.ai.mcp.server.streamable-http.keep-alive-interval=600s

spring.ai.mcp.server.request-timeout=1000s

cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI}

solesonic.mcp.resource=${MCP_REGISTRATION_ENDPOINT}
# Scopes advertised to MCP clients in the protected resource metadata and the 401 challenge.
# Each must be a client scope a dynamically registered client is allowed to request.
solesonic.mcp.scopes=openid,profile,email,roles,solesonic-mcp-audience,mcp-roles

# Jira MCP Tools Configuration
jira.api.uri=https://api.atlassian.com
jira.url.template=${JIRA_URL_TEMPLATE}

solesonic.llm.jira.cloud.id.path=${JIRA_CLOUD_ID_PATH}
solesonic.llm.jira.assignee.page-size=100

# Gmail MCP Tools Configuration
google.api.uri=https://gmail.googleapis.com

# Token Broker Configuration
atlassian.token.broker.uri=${ATLASSIAN_TOKEN_BROKER_URL}
google.token.broker.uri=${GOOGLE_TOKEN_BROKER_URL}

spring.security.oauth2.client.provider.atlassian-token-broker.token-uri=${ATLASSIAN_TOKEN_BROKER_ISSUER_URI}

spring.security.oauth2.client.registration.atlassian-token-broker.client-id=${ATLASSIAN_TOKEN_BROKER_CLIENT_ID}
spring.security.oauth2.client.registration.atlassian-token-broker.client-secret=${ATLASSIAN_TOKEN_BROKER_CLIENT_SECRET}
spring.security.oauth2.client.registration.atlassian-token-broker.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.atlassian-token-broker.provider=atlassian-token-broker

# Tavily Web Search Configuration
tavily.api.uri=https://api.tavily.com
tavily.api.key=${TAVILY_API_KEY}

# Streamed (SSE) responses hold the request open while a workflow runs.
spring.mvc.async.request-timeout=300000
server.tomcat.connection-timeout=120000
server.tomcat.keep-alive-timeout=300000

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.username=${REDIS_USER}

# LangGraph4j checkpoints (Redisson, same Redis server). Finished runs are deleted on release;
# the TTL only backstops runs abandoned mid-flight, e.g. by a crash.
solesonic.checkpoint.ttl=24h

spring.ai.model.chat=openai
spring.ai.openai.model=${DEFAULT_CHAT_MODEL}
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.embedding.model=${EMBEDDING_MODEL}

solesonic.jira.model=${JIRA_MODEL}
solesonic.agile.model=${AGILE_MODEL}

# Redis Chat Memory (requires Redis Stack 7.0+ with RedisJSON and Query Engine)
spring.ai.chat.memory.repository.redis.host=${REDIS_HOST}
spring.ai.chat.memory.repository.redis.port=${REDIS_PORT}
spring.ai.chat.memory.repository.redis.username=${REDIS_USER}
spring.ai.chat.memory.repository.redis.password=${REDIS_PASSWORD}
spring.ai.chat.memory.repository.redis.time-to-live=24h
spring.ai.chat.memory.repository.redis.initialize-schema=true
spring.ai.chat.memory.repository.redis.key-prefix=solesonic:chat:memory:

solesonic.agent.security.enabled=true
